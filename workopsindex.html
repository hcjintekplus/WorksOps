<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI WorkOps Agent</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ---------- tokens.css (Service Web Design System) ---------- */
:root{
  --gray-0:#FFFFFF;--gray-25:#FAFAFB;--gray-50:#F3F4F6;--gray-100:#E5E7EB;--gray-300:#B4B9C2;--gray-500:#6B7280;--gray-900:#111827;
  --navy-600:#1B2A4A;--orange-500:#E8772E;--green-600:#1F8A5B;--red-600:#C8372D;
  --tint-orange:rgba(232,119,46,.10);--tint-green:rgba(31,138,91,.10);--tint-red:rgba(200,55,45,.10);--tint-navy:rgba(27,42,74,.08);
  --focus-ring:0 0 0 3px rgba(27,42,74,.20);
  --font-sans:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --fs-metric:32px;--lh-metric:40px;--fs-h1:24px;--lh-h1:32px;--fs-h2:18px;--lh-h2:26px;--fs-h3:15px;--lh-h3:22px;--fs-body:14px;--lh-body:22px;--fs-label:12px;--lh-label:16px;
  --fw-regular:400;--fw-medium:500;--fw-semibold:600;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-12:48px;--space-16:64px;
  --radius-badge:6px;--radius-control:8px;--radius-card:12px;
  --shadow-float:0 8px 24px rgba(17,24,39,.12);
  --sidebar-w:232px;--sidebar-w-collapsed:64px;--topbar-h:56px;--content-max:1440px;--grid-gutter:24px;--page-margin:32px;
  --control-h:36px;--control-h-compact:32px;--row-h:44px;--row-h-compact:36px;--sheet-w:480px;
  --dur-color:120ms;--dur-panel:200ms;--ease-panel:cubic-bezier(.2,0,0,1);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (max-width:1280px){:root{--page-margin:24px}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gray-0:#16181D;--gray-25:#0F1115;--gray-50:#1F2228;--gray-100:#2C3038;--gray-300:#4B515C;--gray-500:#9AA1AD;--gray-900:#F3F4F6;--navy-600:#8FA3C8;--tint-navy:rgba(143,163,200,.14);--focus-ring:0 0 0 3px rgba(143,163,200,.30)}}
:root[data-theme="dark"]{--gray-0:#16181D;--gray-25:#0F1115;--gray-50:#1F2228;--gray-100:#2C3038;--gray-300:#4B515C;--gray-500:#9AA1AD;--gray-900:#F3F4F6;--navy-600:#8FA3C8;--tint-navy:rgba(143,163,200,.14);--focus-ring:0 0 0 3px rgba(143,163,200,.30)}
@media (prefers-reduced-motion:reduce){:root{--dur-color:0ms;--dur-panel:0ms}}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;font-family:var(--font-sans);font-size:var(--fs-body);line-height:var(--lh-body);color:var(--gray-900);background:var(--gray-25);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1{font-size:var(--fs-h1);line-height:var(--lh-h1);font-weight:var(--fw-semibold);letter-spacing:-.01em}
h2{font-size:var(--fs-h2);line-height:var(--lh-h2);font-weight:var(--fw-semibold);letter-spacing:-.01em}
h3{font-size:var(--fs-h3);line-height:var(--lh-h3);font-weight:var(--fw-semibold)}
a{color:var(--navy-600);text-decoration:none}
a:hover{text-decoration:underline}
.num,td.num,.metric{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-size:13px}
.caption{font-size:var(--fs-label);line-height:var(--lh-label);color:var(--gray-500)}
.label{font-size:var(--fs-label);line-height:var(--lh-label);font-weight:var(--fw-medium);color:var(--gray-500)}
.strong{font-weight:var(--fw-medium)}
.muted{color:var(--gray-500)}
.right{text-align:right}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- app shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--gray-0);border-right:1px solid var(--gray-100);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;transition:width var(--dur-panel) var(--ease-panel),flex-basis var(--dur-panel) var(--ease-panel);overflow:hidden}
.sidebar .brand{height:var(--topbar-h);display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-4);border-bottom:1px solid var(--gray-100);white-space:nowrap}
.brand-mark{width:28px;height:28px;border-radius:var(--radius-control);background:var(--navy-600);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:var(--fw-semibold);font-size:13px;flex:0 0 28px}
.brand-name{font-weight:var(--fw-semibold)}
.brand-sub{font-size:var(--fs-label);line-height:var(--lh-label);color:var(--gray-500)}
.nav{padding:var(--space-3) var(--space-2);display:flex;flex-direction:column;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:var(--space-3);height:36px;padding:0 var(--space-3);border-radius:var(--radius-control);color:var(--gray-900);white-space:nowrap;transition:background var(--dur-color) ease-out}
.nav a:hover{background:var(--gray-25);text-decoration:none}
.nav a.active{background:var(--gray-50);color:var(--navy-600);font-weight:var(--fw-semibold)}
.nav a svg{width:18px;height:18px;flex:0 0 18px}
.nav .sep{height:1px;background:var(--gray-100);margin:var(--space-2) var(--space-3)}
.nav-count{margin-left:auto;font-size:var(--fs-label);line-height:var(--lh-label);background:var(--gray-50);color:var(--gray-500);padding:2px 6px;border-radius:var(--radius-badge);font-variant-numeric:tabular-nums}
.nav a.active .nav-count{background:var(--tint-navy)}
.sidebar-foot{padding:var(--space-3) var(--space-4);border-top:1px solid var(--gray-100);white-space:nowrap}
.shell.collapsed .sidebar{width:var(--sidebar-w-collapsed);flex-basis:var(--sidebar-w-collapsed)}
.shell.collapsed .brand-name,.shell.collapsed .brand-sub,.shell.collapsed .nav a span,.shell.collapsed .nav-count,.shell.collapsed .sidebar-foot{display:none}
.shell.collapsed .nav a{justify-content:center;padding:0}
@media (max-width:1024px){.sidebar{width:var(--sidebar-w-collapsed);flex-basis:var(--sidebar-w-collapsed)}.sidebar .brand-name,.sidebar .brand-sub,.nav a span,.nav-count,.sidebar-foot{display:none}.nav a{justify-content:center;padding:0}}
@media (max-width:640px){.sidebar{display:none}.shell.mobile-open .sidebar{display:flex;position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);flex-basis:var(--sidebar-w);z-index:45;box-shadow:var(--shadow-float)}.shell.mobile-open .sidebar .brand-name,.shell.mobile-open .sidebar .brand-sub,.shell.mobile-open .nav a span,.shell.mobile-open .nav-count,.shell.mobile-open .sidebar-foot{display:block}.shell.mobile-open .nav a{justify-content:flex-start;padding:0 var(--space-3)}.shell.mobile-open .nav-count{display:inline-block}.topbar .crumbs,.topbar #chipRelease,.topbar .fresh{display:none}.topbar{gap:var(--space-2)}}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--topbar-h);background:var(--gray-0);border-bottom:1px solid var(--gray-100);display:flex;align-items:center;gap:var(--space-4);padding:0 var(--page-margin);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.topbar .crumbs{display:flex;align-items:center;gap:var(--space-2);color:var(--gray-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .crumbs b{color:var(--gray-900);font-weight:var(--fw-medium)}
.topbar .spacer{flex:1}
.topbar .fresh{display:flex;align-items:center;gap:var(--space-2);font-size:var(--fs-label);line-height:var(--lh-label);color:var(--gray-500);white-space:nowrap}
.progress{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--navy-600);transform:scaleX(0);transform-origin:left;transition:transform var(--dur-panel) var(--ease-panel)}
.progress.on{transform:scaleX(1)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--gray-100);border-radius:var(--radius-control);background:var(--gray-0);font-size:13px;white-space:nowrap;cursor:pointer;transition:background var(--dur-color) ease-out}
.chip:hover{background:var(--gray-25)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--gray-300)}
.chip.ok .dot{background:var(--green-600)}
.chip.warn .dot{background:var(--orange-500)}
.icon-btn{width:28px;height:28px;border:none;background:transparent;border-radius:var(--radius-control);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gray-500)}
.icon-btn:hover{background:var(--gray-50)}
.icon-btn svg{width:16px;height:16px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.page{max-width:var(--content-max);width:100%;margin:0 auto;padding:var(--space-8) var(--page-margin) var(--space-16)}
.page-head{display:flex;align-items:flex-start;gap:var(--space-6);margin-bottom:var(--space-8)}
.page-head .desc{color:var(--gray-500);margin-top:var(--space-1)}
.page-head .actions{margin-left:auto;display:flex;gap:var(--space-2);flex-shrink:0}
.section{margin-bottom:var(--space-12)}
.section-head{display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-4)}
.section-head .caption{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--grid-gutter)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:1100px){.c3{grid-column:span 6}.c4{grid-column:span 12}.c8{grid-column:span 12}.c6{grid-column:span 12}}
@media (max-width:640px){.c3{grid-column:span 12}}

/* ---------- components ---------- */
.card{background:var(--gray-0);border:1px solid var(--gray-100);border-radius:var(--radius-card);padding:20px;display:flex;flex-direction:column;gap:var(--space-4);min-width:0}
.card-head{display:flex;align-items:baseline;gap:var(--space-3)}
.card-head .caption{margin-left:auto}
.card.pad0{padding:0;gap:0}
.card.pad0 .card-head{padding:16px 20px;border-bottom:1px solid var(--gray-100)}
.kpi .metric{font-size:var(--fs-metric);line-height:var(--lh-metric);font-weight:var(--fw-semibold);letter-spacing:-.01em}
.kpi .delta{font-size:var(--fs-label);line-height:var(--lh-label);color:var(--gray-500);display:flex;align-items:center;gap:6px}
.kpi .delta.up{color:var(--green-600)}
.kpi .delta.over{color:var(--orange-500)}
.kpi .spark{height:28px;width:100%}
.kpi{cursor:pointer;transition:background var(--dur-color) ease-out}
.kpi:hover{background:var(--gray-25)}

.btn{height:var(--control-h);padding:0 14px;border-radius:var(--radius-control);border:1px solid var(--gray-100);background:var(--gray-0);color:var(--gray-900);font-weight:var(--fw-medium);display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;transition:background var(--dur-color) ease-out}
.btn:hover{background:var(--gray-25)}
.btn:active{background:var(--gray-50)}
.btn.primary{background:var(--navy-600);border-color:var(--navy-600);color:#fff}
.btn.primary:hover{background:#243a63}
:root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:var(--gray-25)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.primary:disabled{background:var(--gray-300);border-color:var(--gray-300);cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--gray-50)}
.btn.compact{height:var(--control-h-compact);padding:0 10px;font-size:13px}
.btn:disabled{color:var(--gray-300);cursor:not-allowed}
.btn svg{width:16px;height:16px}

.field{display:flex;flex-direction:column;gap:var(--space-1)}
.field label{font-size:var(--fs-label);line-height:var(--lh-label);font-weight:var(--fw-medium);color:var(--gray-500);display:flex;gap:6px}
.field label .req{font-weight:var(--fw-regular)}
.input,select.input,textarea.input{height:var(--control-h);padding:0 12px;border:1px solid var(--gray-100);border-radius:var(--radius-control);background:var(--gray-0);width:100%;transition:border-color var(--dur-color) ease-out}
textarea.input{height:auto;min-height:88px;padding:8px 12px;resize:vertical}
.input:focus{border-color:var(--navy-600);box-shadow:var(--focus-ring)}
.input.error{border-color:var(--red-600)}
.field .err{font-size:var(--fs-label);line-height:var(--lh-label);color:var(--red-600);display:none}
.field.invalid .err{display:block}
.radio-row{display:flex;gap:var(--space-4);height:var(--control-h);align-items:center}
.radio-row label{display:flex;align-items:center;gap:6px;cursor:pointer}
input[type=radio],input[type=checkbox]{accent-color:var(--navy-600);width:16px;height:16px;margin:0}
.form-row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--space-4)}
.form-row .f3{grid-column:span 3}.form-row .f4{grid-column:span 4}.form-row .f6{grid-column:span 6}.form-row .f8{grid-column:span 8}.form-row .f12{grid-column:span 12}
@media (max-width:900px){.form-row .f3,.form-row .f4,.form-row .f6,.form-row .f8{grid-column:span 12}}

.table-wrap{overflow-x:auto;min-width:0;max-width:100%}
.tbl td.mono,.tbl td.id{white-space:nowrap}
table.tbl{width:100%;border-collapse:collapse;min-width:560px}
.tbl th{height:36px;text-align:left;font-size:var(--fs-label);line-height:var(--lh-label);font-weight:var(--fw-medium);color:var(--gray-500);padding:0 12px;border-bottom:1px solid var(--gray-100);position:sticky;top:0;background:var(--gray-0);white-space:nowrap}
.tbl td{height:var(--row-h);padding:4px 12px;border-bottom:1px solid var(--gray-100);vertical-align:middle}
.tbl.compact td{height:var(--row-h-compact)}
.tbl tbody tr:hover{background:var(--gray-25)}
.tbl tbody tr.clickable{cursor:pointer}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .id{font-family:var(--font-mono);font-size:13px;color:var(--navy-600)}
.tbl tr:last-child td{border-bottom:none}
.tbl tfoot td{font-weight:var(--fw-medium);background:var(--gray-25)}

.badge{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:var(--radius-badge);font-size:var(--fs-label);line-height:var(--lh-label);font-weight:var(--fw-medium);background:var(--gray-50);color:var(--gray-900);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gray-500)}
.badge.prog{background:var(--tint-navy);color:var(--navy-600)}.badge.prog::before{background:var(--navy-600)}
.badge.attn{background:var(--tint-orange);color:#8a3f0f}.badge.attn::before{background:var(--orange-500)}
.badge.done{background:var(--tint-green);color:#155d3e}.badge.done::before{background:var(--green-600)}
.badge.block{background:var(--tint-red);color:#8f251e}.badge.block::before{background:var(--red-600)}
:root[data-theme="dark"] .badge.attn{color:#f0a870}:root[data-theme="dark"] .badge.done{color:#6fcf9a}:root[data-theme="dark"] .badge.block{color:#f08a80}

.empty{display:flex;flex-direction:column;align-items:center;gap:var(--space-3);padding:var(--space-12) var(--space-6);color:var(--gray-500);text-align:center}
.empty svg{width:32px;height:32px;color:var(--gray-300)}
.banner{display:flex;align-items:center;gap:var(--space-3);padding:10px 14px;border-radius:var(--radius-control);font-weight:var(--fw-medium)}
.banner.error{background:var(--tint-red);color:var(--red-600)}
.banner.warn{background:var(--tint-orange);color:#8a3f0f}
.banner.ok{background:var(--tint-green);color:var(--green-600)}
.banner .btn{margin-left:auto}
.banner svg{width:16px;height:16px;flex:0 0 16px}

.stepper{display:flex;border:1px solid var(--gray-100);border-radius:var(--radius-card);background:var(--gray-0);overflow:hidden;margin-bottom:var(--space-6)}
.stepper .step{flex:1;display:flex;align-items:center;gap:var(--space-3);padding:12px 20px;border-right:1px solid var(--gray-100);color:var(--gray-500);cursor:pointer;background:transparent;border-top:none;border-bottom:none;border-left:none;text-align:left;transition:background var(--dur-color) ease-out}
.stepper .step:last-child{border-right:none}
.stepper .step:hover{background:var(--gray-25)}
.stepper .step .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--gray-100);display:flex;align-items:center;justify-content:center;font-size:var(--fs-label);font-weight:var(--fw-medium);flex:0 0 24px}
.stepper .step.active{color:var(--navy-600);font-weight:var(--fw-semibold);background:var(--gray-50)}
.stepper .step.active .n{background:var(--navy-600);color:#fff;border-color:var(--navy-600)}
.stepper .step.done .n{background:var(--tint-green);color:var(--green-600);border-color:transparent}
.stepper .step:disabled{cursor:not-allowed;opacity:.6}
.stepper .step .t{display:flex;flex-direction:column}
.stepper .step .t small{font-size:var(--fs-label);line-height:var(--lh-label);font-weight:var(--fw-regular);color:var(--gray-500)}
@media (max-width:900px){.stepper .step .t small{display:none}.stepper .step{padding:12px}}

.tabs{display:flex;gap:var(--space-1);border-bottom:1px solid var(--gray-100);margin-bottom:var(--space-6);overflow-x:auto}
.tabs button{height:40px;padding:0 14px;border:none;background:transparent;border-bottom:2px solid transparent;color:var(--gray-500);font-weight:var(--fw-medium);cursor:pointer;white-space:nowrap;margin-bottom:-1px;transition:color var(--dur-color) ease-out}
.tabs button:hover{color:var(--gray-900)}
.tabs button.active{color:var(--navy-600);border-bottom-color:var(--navy-600)}

.list{display:flex;flex-direction:column}
.list .row{display:flex;align-items:center;gap:var(--space-3);padding:10px 0;border-bottom:1px solid var(--gray-100)}
.list .row:last-child{border-bottom:none}
.list .row .grow{flex:1;min-width:0}
.list .row .title{font-weight:var(--fw-medium);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.evid{border:1px solid var(--gray-100);border-radius:var(--radius-control);overflow:hidden}
.evid summary{cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:var(--space-3);list-style:none;font-weight:var(--fw-medium)}
.evid summary::-webkit-details-marker{display:none}
.evid summary:hover{background:var(--gray-25)}
.evid .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:var(--space-3)}
.evid blockquote{margin:0;padding:10px 12px;background:var(--gray-25);border-left:2px solid var(--gray-300);border-radius:0 var(--radius-badge) var(--radius-badge) 0;color:var(--gray-900)}
.evid .meta{display:flex;gap:var(--space-3);flex-wrap:wrap}

.opt{border:1px solid var(--gray-100);border-radius:var(--radius-control);padding:14px 16px;display:flex;flex-direction:column;gap:var(--space-3);cursor:pointer;transition:background var(--dur-color) ease-out}
.opt:hover{background:var(--gray-25)}
.opt.selected{border-color:var(--navy-600);box-shadow:inset 0 0 0 1px var(--navy-600)}
.opt.blocked{opacity:.6;cursor:not-allowed}
.opt .top{display:flex;align-items:center;gap:var(--space-3)}
.opt .top .name{font-weight:var(--fw-semibold);flex:1}
.opt .cost{font-size:var(--fs-h2);line-height:var(--lh-h2);font-weight:var(--fw-semibold);font-variant-numeric:tabular-nums}
.opt .breakdown{display:none;border-top:1px solid var(--gray-100);padding-top:var(--space-3)}
.opt.open .breakdown{display:block}
.cost-grid{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:13px}
.cost-grid .num{text-align:right}

.toast{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--gray-900);color:var(--gray-0);padding:10px 16px;border-radius:var(--radius-control);box-shadow:var(--shadow-float);display:flex;align-items:center;gap:var(--space-3);z-index:60;transform:translateY(16px);opacity:0;transition:transform var(--dur-panel) var(--ease-panel),opacity var(--dur-panel) var(--ease-panel);pointer-events:none}
.toast.show{transform:none;opacity:1}
.toast.ok::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green-600)}

/* ===================== 백엔드 어댑터 (Mock ↔ Jira) ===================== */
/* MockAdapter: 브라우저 저장소의 Mock Project System.

  name: 'Mock Project System',
  async list(entity) { return S.db[entity] || []; },
  async get(entity, id) { return (S.db[entity] || []).find(x => x.id === id) || null; },
  async createIssue(issue) { S.db.issues.unshift(issue); save(); return issue; },

/* ===================== Knowledge 검색 (키워드 기반 — 벡터DB 자리) ===================== */
function searchKnowledge(query, k = 8) {
  const terms = tokenize(query);
  const scored = KNOWLEDGE.map(d => {
    const text = (d.title + ' ' + d.must + ' ' + d.module + ' ' + d.product + ' ' + Object.values(d.sections).join(' ')).toLowerCase();
    let score = 0; terms.forEach(t => { if (text.includes(t)) score += t.length > 1 ? 1 : 0.3; });
    return { doc: d, score: terms.length ? score / terms.length : 0 };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);
  return scored.slice(0, k);
}
function tokenize(q) { return (q || '').toLowerCase().replace(/[^\p{L}\p{N}\s.\-]/gu, ' ').split(/\s+/).filter(t => t.length >= 2); }
function retrieveForIssue(issue) {
  // 시나리오용 검색: 이슈 텍스트 + 모듈로 근거 문서를 모으고, 방해 문서를 걸러낸다.
  const q = issue.title + ' ' + issue.description + ' ' + issue.module + ' 재부팅 연결 대기열 라이브러리 요구사항 회귀 품질규정 계약';
  const hits = searchKnowledge(q, 20).filter(h => !h.doc.distractor);
  if (issue.simulate === 'insufficient') return hits.filter(h => !['TR-0921', 'CHG-123', 'SRS-HUB20', 'TR-REG', 'SDD-HUB'].includes(h.doc.doc_id));
  return hits;
}

    const follow_up_cost = o.type === 'scope_cut' ? A('scope_cut_follow_up_cost') : 0;
    const recurrence_loss = o.recurrence_prob * recurLossDays * daily;

  const afterDays = run.effectInput?.days ?? Math.max(1, Math.ceil(((run.timer_ms || 0) / 3600000 + (run.effectInput?.review_hours ?? 2)) / 8));
  const llm = run.agentRuns.reduce((s, r) => s + (r.llm_cost_krw || 0), 0);
  const labor_before = beforeMH * rate, labor_after = afterMH * rate;
  const labor_saving = labor_before - labor_after - llm;
  const delay_avoided = Math.max(0, beforeDays - afterDays) * A('daily_delay_cost');
  const annual = labor_saving * A('issues_per_year') + delay_avoided * A('schedule_issues_per_year') - A('annual_opex');
  const conservative = labor_saving * A('issues_per_year') + (2 * (A('headcount') * A('hours_per_day') * rate)) * A('schedule_issues_per_year') - A('annual_opex');
  return { decision_days_before: beforeDays, decision_days_after: afterDays, manhours_before: beforeMH, manhours_after: afterMH, labor_cost_before: labor_before, labor_cost_after: labor_after, llm_cost: llm, labor_saving, delay_cost_avoided: delay_avoided, annual_net: annual, annual_conservative: conservative };
}

  const annual = labor * A('issues_per_year') + delay * A('schedule_issues_per_year') - A('annual_opex');

/* ===================== 파이프라인 (순차 호출, Orchestrator 없음) ===================== */
async function runAgent(run, agent, fn) {

  S.agentRuns.push(rec); run.agentRuns.push(rec);
  try { const out = await fn(); rec.ended_at = new Date().toISOString(); rec.tokens = (out._usage?.input_tokens || 0) + (out._usage?.output_tokens || 0); rec.llm_cost_krw = llmCost(out._usage); rec.status = '완료'; save(); return out; }

}

  const costed = costModel(run.action.options, run.impact, A('after_decision_days'));
  run.costs = applyRules(costed, run.analysis, run.impact, S.db);
  run.cr = { ...run.action.change_request_draft };
  run.selected = run.costs.recommended_option; run.override_reason = '';
  save(); return run;
}

  const run = getRun(issue.id);
  const option = run.costs.options.find(o => o.option_id === run.selected);
  const changes = await Backend.a.applyDecision(issue, option, { ...run.action, change_request_draft: run.cr }, run.impact);
  const log = { id: 'DL-' + (S.decisionLogs.length + 1), issue_id: issue.id, ai_recommended: run.costs.recommended_option, pm_selected: run.selected, override_reason: run.override_reason || null, decided_at: new Date().toISOString() };
  S.decisionLogs.push(log); run.decision = log; run.changes = changes;

}

async function submitIssue() {
  const title = document.getElementById('fTitle'), desc = document.getElementById('fDesc');

function stepOf(issue, run) { if (run?.decision) return 4; if (run?.costs) return 3; if (run?.analysis) return 2; return 1; }
function issueDetail(issue, stepParam) {
  const run = getRun(issue.id);
  const cur = stepOf(issue, run);
  const want = stepParam === 'analyze' ? 2 : stepParam === 'options' ? 3 : stepParam === 'result' ? 4 : stepParam === 'intake' ? 1 : cur;
  const maxStep = run.decision ? 4 : run.analysis ? 3 : 2;
  const step = Math.min(want, maxStep);
  renderTopbar(['AI WorkOps Agent', '이슈 대응', issue.id]);
  const steps = [['접수', 'S-001'], ['AI 분석 결과', 'S-002 원인·영향'], ['대응안 비교·승인', 'S-003'], ['반영 결과·효과', 'S-004']];
  const rel = S.db.releases.find(r => r.id === issue.release_id) || {};
  return `
  <div class="page-head"><div><div class="caption" style="margin-bottom:4px"><span class="mono">${issue.id}</span> · ${badge(issue.severity)} · ${esc(rel.name || '')} D-${rel.d_minus ?? '-'} · ${badge(issue.status)}</div><h1>${esc(issue.title)}</h1><div class="desc">${esc(issue.description)}</div></div>

  <div class="stepper">${steps.map(([t, s], i) => `<button class="step ${i + 1 === step ? 'active' : ''} ${i + 1 < cur ? 'done' : ''}" ${i + 1 > maxStep ? 'disabled' : ''} onclick="go('issues/${issue.id}/${['intake', 'analyze', 'options', 'result'][i]}')"><span class="n">${i + 1}</span><span class="t">${t}<small>${s}</small></span></button>`).join('')}</div>
  <div id="stepBody">${[null, stepIntake, stepAnalyze, stepOptions, stepResult][step](issue, run)}</div>`;
}

      `<tr><td>① 대응 인건비</td><td class="num">${won(e.labor_cost_before)}</td><td class="num">${won(e.labor_cost_after)} + LLM ${fmtNum(e.llm_cost)}원</td><td class="num strong">${won(e.labor_saving)}/건</td></tr>`,

function bindIssueDetail(issue, stepParam) {
  const run = getRun(issue.id);
  const timerEl = document.getElementById('issueTimer');
  if (run.timer_start) timerTick = setInterval(() => { if (timerEl) timerEl.textContent = fmtTime(elapsedMs(run)); }, 1000);
  const cur = stepOf(issue, run);
  if (stepParam === 'analyze' && !run.analysis && !run.decision && !run._running) {
    run._running = true; delete run.error;
    pipelineAnalyze(issue).then(() => { run._running = false; render(); }).catch(e => { run._running = false; run.analysis = run.analysis || { causes: [], similar_issues: [], insufficient_evidence: true }; run.impact = run.impact || { affected_requirements: [], affected_tasks: [], affected_risks: [], contract_terms: [], release_blocked: false, baseline: { fix_and_verify_days: 0, buffer_days: 5, delay_if_untreated: 0 } }; run.error = e.message; save(); render(); });
  }
  if (stepParam === 'options' && run.analysis && run.analysis.causes.length && !run.costs && !run.decision && !run._running) {
    run._running = true;
    pipelineAction(issue).then(() => { run._running = false; render(); }).catch(e => { run._running = false; run.error = e.message; save(); go('issues/' + issue.id + '/analyze'); });
  }
  const q = (id) => document.getElementById(id);
  if (q('genOptions')) q('genOptions').onclick = () => go('issues/' + issue.id + '/options');
  if (q('rerunAnalyze')) q('rerunAnalyze').onclick = () => { delete run.analysis; delete run.impact; delete run.costs; delete run.error; save(); go('issues/' + issue.id + '/analyze'); render(); };
  if (q('retryAnalyze')) q('retryAnalyze').onclick = () => { delete run.analysis; delete run.impact; delete run.error; save(); render(); };
  if (q('addManualCause')) q('addManualCause').onclick = () => { const v = q('manualCause').value.trim(); if (!v) return; run.analysis.causes.push({ rank: run.analysis.causes.length + 1, label: v, evidence_strength: 'Low', citations: [{ doc_id: 'PM 입력', section: '-', snippet: '사람이 직접 입력한 원인 후보' }] }); run.analysis.insufficient_evidence = false; save(); render(); };
  document.querySelectorAll('.opt').forEach(el => {
    el.addEventListener('click', (ev) => { if (el.classList.contains('blocked')) return; if (ev.target.closest('.breakdown')) return; const id = el.dataset.opt; if (ev.target.tagName !== 'INPUT') el.classList.toggle('open'); run.selected = id; document.querySelectorAll('.opt').forEach(o => o.classList.toggle('selected', o.dataset.opt === id)); el.querySelector('input[type=radio]').checked = true; q('ovrField').classList.toggle('on', id !== run.costs.recommended_option); q('approveBtn').disabled = false; save(); });
  });

  if (q('approveBtn')) q('approveBtn').onclick = () => {
    run.cr = { title: q('crTitle').value, reason: q('crReason').value, impact: q('crImpact').value, approval_request: q('crApproval').value };
    run.override_reason = q('ovrReason').value.trim();
    if (run.selected !== run.costs.recommended_option && !run.override_reason) { q('ovrReason').classList.add('error'); q('ovrReason').focus(); return; }
    const o = run.costs.options.find(x => x.option_id === run.selected);
    confirmModal('선택안 승인 및 반영', `<p>대응안 <b>${o.option_id}. ${esc(o.title)}</b> (기대비용 ${won(o.expected_cost)})을 승인하고 ${Backend.a.name}에 반영합니다.</p>${o.escalation ? `<div class="banner warn" style="margin-top:12px">${ICONS.warn}${esc(o.escalation)}</div>` : ''}<p class="caption" style="margin-top:12px">반영 중 오류가 나면 모든 변경을 롤백합니다.</p>`, '승인 및 반영', async () => {
      document.getElementById('progress').classList.add('on');
      try { await pipelineApprove(issue); toast('승인 결과를 반영했습니다'); go('issues/' + issue.id + '/result'); }
      catch (e) { const body = document.getElementById('stepBody'); body.insertAdjacentHTML('afterbegin', `<div class="banner error" style="margin-bottom:24px">${ICONS.warn}반영 실패 · DB 변경을 롤백했습니다 — ${esc(e.message)}<button class="btn compact" onclick="render()">재시도</button></div>`); }
      finally { document.getElementById('progress').classList.remove('on'); }
    });
  };
  if (q('effSave')) q('effSave').onclick = () => { run.effectInput = { manhours: +q('effMH').value || A('after_manhours'), review_hours: +q('effReview').value || 0, days: q('effDays').value ? +q('effDays').value : undefined }; run.effect = computeEffect(run); const rec = S.effectRecords.find(r => r.issue_id === issue.id); if (rec) Object.assign(rec, run.effect); save(); toast('KPI를 다시 계산했습니다'); render(); };
  if (q('closeIssue')) q('closeIssue').onclick = async () => { await Backend.a.updateIssue(issue.id, { status: '종료' }); toast('이슈를 종료했습니다'); render(); };
}

function knowledgeResults(q, type = '', distract = false) {
  const terms = tokenize(q);
  const hits = searchKnowledge(q, 12).filter(h => (!type || h.doc.doc_type === type) && (distract || !h.doc.distractor));
  if (!hits.length) return emptyState('조건에 맞는 문서가 없습니다 — 근거 부족 · 확인 필요');
  const hl = (t) => { let s = esc(t); terms.forEach(k => { s = s.replace(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`); }); return s; };
  return hits.map(h => { const d = h.doc; const sec = Object.entries(d.sections).find(([k, v]) => terms.some(t => v.toLowerCase().includes(t))) || Object.entries(d.sections)[0]; return `<div class="doc-row"><h3><a href="#" onclick="sheetDoc('${d.doc_id}');return false">${esc(d.title)}</a> <span class="mono caption">${d.doc_id} §${esc(sec[0])}</span>${h.score < S.rules.similarity_threshold ? ' ' + badge('주의').replace('주의', '유사도 낮음') : ''}</h3><div class="src">${esc(d.doc_type)} · ${esc(d.product)} · ${esc(d.module)} · 유사도 ${h.score.toFixed(2)}</div><div>${hl(sec[1])}</div></div>`; }).join('');
}
function sheetDoc(id) { const d = KNOWLEDGE.find(k => k.doc_id === id); if (!d) return; openSheet(`<span class="mono">${d.doc_id}</span> ${esc(d.title)}`, `<dl class="kv"><dt>유형</dt><dd>${esc(d.doc_type)}</dd><dt>제품</dt><dd>${esc(d.product)}</dd><dt>모듈</dt><dd>${esc(d.module)}</dd><dt>심각도</dt><dd>${esc(d.severity)}</dd><dt>사용 Agent</dt><dd>${d.agents.join(', ') || '-'}</dd><dt>꼭 들어갈 내용</dt><dd>${esc(d.must)}</dd></dl><div class="label">섹션</div>${Object.entries(d.sections).map(([k, v]) => `<div><div class="caption mono">§${esc(k)}</div><blockquote style="margin:4px 0 0;padding:10px 12px;background:var(--gray-25);border-left:2px solid var(--gray-300)">${esc(v)}</blockquote></div>`).join('')}`); }
BIND.knowledge = (params, query) => {

일 지연 비용   = 인력 ${A('headcount')}명 × ${A('hours_per_day')}시간 × ${won(A('hourly_rate'))} (${won(A('headcount') * A('hours_per_day') * A('hourly_rate'))}) + 외부 비용 ${won(A('external_cost_day'))}
기회손실·후속   = 기능 축소안만: ${won(A('scope_cut_opportunity_loss'))} + ${won(A('scope_cut_follow_up_cost'))} (CG-001 §2)
LLM 비용        = 입력 ${A('llm_krw_per_1k_input')}원/1k 토큰 + 출력 ${A('llm_krw_per_1k_output')}원/1k 토큰</pre></div>`;

    `<tr><td class="strong">② 출시 지연 비용 회피<br><span class="caption">원/건</span></td><td>(Before 확정 기간 − After 확정 기간) × 일 지연 비용 ${won(A('daily_delay_cost'))}</td><td class="caption">확정 기간 5일 → 1일 가정<br>분석·작성 단계 시간은 앱 타이머 실측<br>일 지연 비용 가정</td><td class="num">≥ 2억원/건<br><span class="caption">5일 → 1일</span></td></tr>`,

  <div class="section"><div class="section-head"><h2>Before 1회 수작업 측정 (5-1)</h2><span class="caption">팀원 1명이 AI 없이 같은 자료로 SC-01을 처리하며 시간 측정 · 11/15</span></div><div class="grid"><div class="card c6">
    ${S.beforeMeasure ? `<div class="banner ok">${ICONS.check}측정값 등록됨 · ${S.beforeMeasure.days}영업일 · ${S.beforeMeasure.manhours}인시 (${esc(S.beforeMeasure.who)}, ${S.beforeMeasure.date})</div>` : `<div class="banner warn">${ICONS.warn}가정치 설정 사용 중 · 측정값이 등록되면 KPI Before가 실측으로 바뀝니다</div>`}
    <div class="form-row"><div class="field f4"><label>측정자</label><input class="input" id="bmWho" value="${esc(S.beforeMeasure?.who || '')}"></div><div class="field f4"><label>확정 기간 (영업일)</label><input class="input num" type="number" id="bmDays" value="${S.beforeMeasure?.days ?? ''}"></div><div class="field f4"><label>투입 인시</label><input class="input num" type="number" id="bmMH" value="${S.beforeMeasure?.manhours ?? ''}"></div></div>

  q('simFail').onchange = () => { S.settings.simulateApplyFail = q('simFail').checked; save(); };
  q('exportAll').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' })); a.download = 'workops_state.json'; a.click(); toast('JSON을 내려받았습니다'); };
  q('resetAll').onclick = () => confirmModal('시드로 초기화', '<p>등록한 이슈, 분석 결과, 승인 이력, 효과 기록이 모두 지워지고 PRD 시드 데이터로 돌아갑니다.</p>', '초기화', () => { const keep = { theme: S.settings.theme, collapsed: S.settings.collapsed }; S = freshState(); Object.assign(S.settings, keep); save(); toast('시드로 초기화했습니다'); render(); });
};

/* ===================== 초기화 ===================== */
function applyTheme() { const t = S.settings.theme; if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }
(function init() {
  applyTheme();
  const shell = document.getElementById('shell'); if (S.settings.collapsed) shell.classList.add('collapsed');
  const cb = document.getElementById('collapseBtn'); cb.innerHTML = ICONS.menu; cb.onclick = () => { if (window.innerWidth <= 640) { shell.classList.toggle('mobile-open'); return; } shell.classList.toggle('collapsed'); S.settings.collapsed = shell.classList.contains('collapsed'); save(); };
  const rb = document.getElementById('refreshBtn'); rb.innerHTML = ICONS.refresh; rb.onclick = () => { rb.classList.add('spin'); const p = document.getElementById('progress'); p.classList.add('on'); setTimeout(() => { S.lastRefresh = Date.now(); save(); rb.classList.remove('spin'); p.classList.remove('on'); render(); }, 600); };
  const tb = document.getElementById('themeBtn'); tb.innerHTML = ICONS.sun; tb.onclick = () => { const order = ['auto', 'light', 'dark']; S.settings.theme = order[(order.indexOf(S.settings.theme) + 1) % 3]; applyTheme(); save(); toast('테마: ' + { auto: '시스템', light: '라이트', dark: '다크' }[S.settings.theme]); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSheet(); document.getElementById('modalBg').classList.remove('on'); } });
  setInterval(() => { const f = document.getElementById('fresh'); if (f && f.firstChild) f.firstChild.textContent = ago(S.lastRefresh); }, 30000);
  render();
})();
</script>
</body>
